<nav
  class="breadcrumbs"
  aria-label="Breadcrumb"
>
  <ol class="breadcrumbs__list">
    @for (
      item of items();
      track item.label;
      let isLast = $last
    ) {
      <li class="breadcrumbs__item">
        @if (item.url && !isLast) {
          <a
            class="breadcrumbs__link"
            [routerLink]="item.url"
          >
            {{ item.label }}
          </a>
        } @else {
          <span
            class="breadcrumbs__current"
            aria-current="page"
          >
            {{ item.label }}
          </span>
        }

        @if (!isLast) {
          <span
            class="breadcrumbs__separator"
            aria-hidden="true"
          >
          /
          </span>
        }
      </li>
    }
  </ol>
</nav>
